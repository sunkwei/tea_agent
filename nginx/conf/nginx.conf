# nginx.conf — 由 Tea Agent 生成
# 启动:  cd <项目根目录>  &&  nginx -p nginx
# 停止:  nginx -p nginx -s stop
# 重载:  nginx -p nginx -s reload
# HTTPS 监听: 9443 (自签名证书, conf/server.crt / conf/server.key)

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 默认站点 — HTTPS 9443
    server {
        listen       9443 ssl;
        server_name  localhost;

        # 自签名证书（与 nginx.conf 同目录，相对路径按配置文件目录解析）
        ssl_certificate      server.crt;
        ssl_certificate_key  server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # 站点根目录
        root   html;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        # ── /tea_agent 反向代理 → localhost:8282 (tea-agent API) ──
        # 访问 https://localhost:9443/tea_agent/  →  8282/
        # 访问 https://localhost:9443/tea_agent/docs → 8282/docs
        location = /tea_agent {
            return 301 /tea_agent/;
        }
        location /tea_agent/ {
            proxy_pass http://127.0.0.1:8282/;   # 尾部斜杠 = 剥离 /tea_agent 前缀
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 支持 WebSocket 升级
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            # SSE 流式输出不缓冲
            proxy_buffering off;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;

            # ── 路径重写：前端绝对路径 → 带 /tea_agent 前缀 ──
            # tea_agent.server 前端硬编码 /api /v1 /static /dag 等绝对路径，
            # 经本代理需改写为 /tea_agent/xxx 才能被 nginx 正确转发。
            # 仅处理 HTML/JS/CSS 文本，绝不含 application/json（避免污染 API 数据）。
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript text/css;
            sub_filter 'src="/static/' 'src="/tea_agent/static/';
            sub_filter 'href="/static/' 'href="/tea_agent/static/';
            sub_filter '"/static/' '"/tea_agent/static/';
            sub_filter "'/static/" "'/tea_agent/static/";
            sub_filter '"/api/' '"/tea_agent/api/';
            sub_filter "'/api/" "'/tea_agent/api/";
            sub_filter '"/v1/' '"/tea_agent/v1/';
            sub_filter "'/v1/" "'/tea_agent/v1/";
            sub_filter '"/dag/' '"/tea_agent/dag/';
            sub_filter "'/dag/" "'/tea_agent/dag/";
            sub_filter '"/docs' '"/tea_agent/docs';
            sub_filter "'/docs" "'/tea_agent/docs";
            sub_filter '"/openapi.json' '"/tea_agent/openapi.json';
            sub_filter "'/openapi.json" "'/tea_agent/openapi.json";
        }

        # 错误页
        error_page  404  /404.html;
        location = /404.html {
            internal;
        }
    }
}
