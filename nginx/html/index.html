<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>nginx HTTPS Server · 9443</title>
<style>
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#0d1117; color:#e6edf3; }
.box { text-align:center; padding:3rem; border:1px solid #30363d; border-radius:16px; background:#161b22; box-shadow:0 10px 40px rgba(0,0,0,.5); }

.badge { display:inline-block; margin-top:1rem; padding:.35rem .9rem; border-radius:999px; background:#1f6feb22; color:#58a6ff; border:1px solid #1f6feb55; font-size:.85rem; }

</head>
<body>
<div class="box">
  <h1>🔒 nginx HTTPS Server</h1>
