[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tea_agent"
version = "0.17.4"
description = "A self-evolving AI agent with dynamic toolkit management."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    {name = "sunkw", email = "sunkwei@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0",
    "markdown>=3.4.0",
    "pyautogui>=0.9.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "requests>=2.30.0",
    "beautifulsoup4>=4.12.0",
    "jieba>=0.42.0",
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "jedi>=0.19.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "fpdf2>=2.8.0",
    "pygments>=2.10.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
tea_agent = "tea_agent.server:main"
tea_agent_api = "tea_agent.server:main"
tea-agent-api = "tea_agent.server:main"
tea-agent-mini = "tea_agent_mini.__main__:main"
tea-agent-acp = "tea_agent.protocol:main"
tea-agent-telegram = "tea_agent.channel.telegram_adapter:run_telegram_bot"
tea-agent-wechat = "tea_agent.channel.wechat_adapter:run_wechat_bot"

[project.optional-dependencies]
web = [
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.7",
]
telegram = [
    "python-telegram-bot>=20.0",
    "httpx>=0.25.0",
]
mini = [
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.7",
]
# 进程监控（toolkit_exec 增强，有 try 保护）
monitor = ["psutil>=5.9.0"]
# Windows OCR（toolkit_ocr，有 try 保护，仅 Windows）
ocr = ["winocr>=0.3.0"]
# 微信渠道（wechat_adapter，有 try 保护）
channel = ["qrcode>=7.0.0", "qrterm>=2.3.0"]
# 演示脚本（demo/ 目录）
demo = [
    "numpy>=1.24.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "tensorflow>=2.0.0",
    "tflite-runtime>=2.0.0",
]
# 测试与开发（CI 用 `pip install -e .[dev]` 后 `pytest -n auto`）
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tea_agent/tests"]
timeout = 180          # 单个测试超时保护（防网络/LLM 挂死）
timeout_method = "thread"
addopts = "-ra --durations=15"
markers = [
    "slow: 慢速集成测试（默认 CI 并行跑，本地可 -m 'not slow'）",
]

[tool.ruff]
line-length = 150
target-version = "py310"
# 门禁只覆盖「随包发布 + 其测试」的代码。开发脚手架 / 演示 / 一次性分析脚本不随包
# 分发，历史欠账大，纳入只会淹没真正的问题；需要收紧时删掉对应条目即可。
extend-exclude = [
    "demo",
    "docs",
    "scripts",
    "benchmark",
    "benchmarks",
    "deploy",
    "nginx",
    "output",
    "uploads",
    "tmp",
    "tea_agent/demo",
    # 根目录构建脚本（不随包分发）
    "build_mini.py",
    "build_nuitka.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试：sys.path 注入后再 import（E402）；需跨断言存活、不能 with 收口的句柄（SIM115）
"tea_agent/tests/**" = ["E402", "SIM115"]
# 惰性导出（PEP 562）与「必须晚于 try/except(starlette) 的 import」——导入位置刻意为之，
# 用于换取「未装可选依赖时给出友好报错」的行为。
"tea_agent/__init__.py" = ["E402"]
"tea_agent/server/_compat.py" = ["E402"]
"tea_agent/server/server.py" = ["E402"]
# 审计锁文件：句柄需跨越 yield 存续（非泄漏），不能 with 收口。
"tea_agent/audit_log.py" = ["SIM115"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"tea_agent.server" = ["*.py", "static/*.html", "static/*.js", "static/*.css"]
"tea_agent.skills" = ["**/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tea_agent*"]
